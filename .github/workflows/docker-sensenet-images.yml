name: Docker images - SenseNet

on:
  push:
    branches:
      - develop
      - master
      - postgres-provider
    paths:
      - src/**
      - .github/workflows/_docker-build-image.yml
      - .github/workflows/docker-sensenet-images.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - master
    paths:
      - src/**
      - .github/workflows/_docker-build-image.yml
      - .github/workflows/docker-sensenet-images.yml
  workflow_dispatch:
    inputs:
      image:
        description: Image to build, if available on the selected branch.
        required: true
        default: all
        type: choice
        options:
          - all
          - inmem
          - sql
          - nlb
          - sql-preview
          - nlb-preview
          - postgres
      push_image:
        description: Push built images to Docker Hub.
        required: false
        default: false
        type: boolean
      custom_tag:
        description: Optional extra tag for a manual publication.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docker-sensenet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create build matrix
        id: matrix
        shell: bash
        env:
          SELECTED_IMAGE: ${{ github.event.inputs.image || 'all' }}
        run: |
          set -euo pipefail

          case "${SELECTED_IMAGE}" in
            all|inmem|sql|nlb|sql-preview|nlb-preview|postgres) ;;
            *)
              echo "::error::Unsupported image selection: ${SELECTED_IMAGE}"
              exit 1
              ;;
          esac

          ENTRIES=()
          while IFS='|' read -r ID IMAGE DOCKERFILE PREPARE_INSTALL_PACKAGE; do
            if [[ "${SELECTED_IMAGE}" != 'all' && "${SELECTED_IMAGE}" != "${ID}" ]]; then
              continue
            fi

            if [[ ! -f "${DOCKERFILE}" ]]; then
              if [[ "${SELECTED_IMAGE}" == "${ID}" ]]; then
                echo "::error::The selected image is not available on this branch: ${DOCKERFILE}"
                exit 1
              fi

              echo "::notice::Skipping ${ID}; Dockerfile is not available on this branch."
              continue
            fi

            ENTRIES+=("{\"id\":\"${ID}\",\"image\":\"${IMAGE}\",\"dockerfile\":\"${DOCKERFILE}\",\"prepare_install_package\":${PREPARE_INSTALL_PACKAGE}}")
          done <<'IMAGES'
          inmem|sensenetcsp/sn-api-inmem|./src/WebApps/SnWebApplication.Api.InMem.TokenAuth/Dockerfile|false
          sql|sensenetcsp/sn-api-sql|./src/WebApps/SnWebApplication.Api.Sql.TokenAuth/Dockerfile|false
          nlb|sensenetcsp/sn-api-nlb|./src/WebApps/SnWebApplication.Api.Sql.SearchService.TokenAuth/Dockerfile|true
          sql-preview|sensenetcsp/sn-api-sql-prv|./src/WebApps/SnWebApplication.Api.Sql.TokenAuth.Preview/Dockerfile|true
          nlb-preview|sensenetcsp/sn-api-nlb-prv|./src/WebApps/SnWebApplication.Api.Sql.SearchService.TokenAuth.Preview/Dockerfile|true
          postgres|sensenetcsp/sn-api-postgre|./src/WebApps/SnWebApplication.Api.PostgreSql.TokenAuth/Dockerfile|false
          IMAGES

          if (( ${#ENTRIES[@]} == 0 )); then
            echo "::error::No Docker image source is available for the selected revision."
            exit 1
          fi

          printf -v JOINED_ENTRIES '%s,' "${ENTRIES[@]}"
          MATRIX="{\"include\":[${JOINED_ENTRIES%,}]}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.id }}
    needs: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_docker-build-image.yml
    with:
      context: ./src
      dockerfile: ${{ matrix.dockerfile }}
      image: ${{ matrix.image }}
      cache_scope: sensenet-${{ matrix.id }}
      prepare_install_package: ${{ matrix.prepare_install_package }}
      branch_tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      floating_tag: ${{ github.event_name == 'push' && github.ref_name == 'develop' && 'preview' || github.event_name == 'push' && github.ref_name == 'master' && 'latest' || '' }}
      custom_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.custom_tag || '' }}
      push_image: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
