# Equivalent demo: ./install-sensenet.ps1 -InMemPlatform -UseAuth
# Run from this folder: docker compose -f docker-compose.in-memory-auth.yml up -d
name: "sensenet-inmem"
services:
  snapp:
    extends:
      file: "compose.services.yml"
      service: "repository"
    image: "sensenetcsp/sn-api-inmem:${SN_IMAGE_TAG:-preview}"
    build:
      context: "../src"
      dockerfile: "WebApps/SnWebApplication.Api.InMem.TokenAuth/Dockerfile"
    environment:
      sensenet__authentication__repositoryUrl: "https://localhost:51011"
      sensenet__authentication__authServerType: "SNAuth"
      sensenet__authentication__authority: "https://localhost:51012"
      sensenet__authentication__metadatahost: "http://snis"
      sensenet__authentication__AddJwtCookie: "false"
    ports: ["127.0.0.1:51011:443"]
    depends_on:
      snis:
        condition: "service_started"
  snis:
    extends:
      file: "compose.services.yml"
      service: "snauth"
    environment:
      Sensenet__Repository__Url: "https://localhost:51011"
      JwtSettings__Issuer: "https://localhost:51012"
      Application__Url: "https://localhost:51012"
      Application__AllowedHosts__1: "https://localhost:51011"
    ports: ["127.0.0.1:51012:443"]
networks:
  sensenet:
    driver: "bridge"
