# Equivalent demo: ./install-sensenet.ps1 -InMemPlatform
# Run from this folder: docker compose -f docker-compose.in-memory.yml up -d
name: "sensenet-inmem"
services:
  snapp:
    extends:
      file: "compose.services.yml"
      service: "repository"
    image: "sensenetcsp/sn-api-inmem:${SN_IMAGE_TAG:-preview}"
    build:
      context: "../src"
      dockerfile: "WebApps/SnWebApplication.Api.InMem.TokenAuth/Dockerfile"
    environment:
      sensenet__authentication__repositoryUrl: "https://localhost:51011"
      sensenet__authentication__authServerType: "IdentityServer"
      sensenet__authentication__authority: "https://localhost:51012"
      sensenet__authentication__metadatahost: "http://snis"
      sensenet__authentication__AddJwtCookie: "true"
    ports: ["127.0.0.1:51011:443"]
    depends_on:
      snis:
        condition: "service_started"
  snis:
    extends:
      file: "compose.services.yml"
      service: "identity"
    environment:
      IdentityServer__IssuerUri: "https://localhost:51012"
      sensenet__Clients__adminui__RepositoryHosts__0__PublicHost: "https://localhost:51011"
      sensenet__Clients__spa__RepositoryHosts__0__PublicHost: "https://localhost:51011"
      sensenet__Clients__client__RepositoryHosts__0__PublicHost: "https://localhost:51011"
    ports: ["127.0.0.1:51012:443"]
networks:
  sensenet:
    driver: "bridge"
