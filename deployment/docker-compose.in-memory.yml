# Matching installer scenario (legacy ports are opt-in): ./install-sensenet.ps1 -InMemPlatform
# Run from this folder: docker compose -f docker-compose.in-memory.yml up -d
name: "sensenet-demo-in-memory"
services:
  prerequisites:
    extends:
      file: "compose.services.yml"
      service: "prerequisites"
  snapp:
    extends:
      file: "compose.services.yml"
      service: "repository"
    image: "sensenetcsp/sn-api-inmem:${SN_IMAGE_TAG:-preview}"
    build:
      context: "../src"
      dockerfile: "WebApps/SnWebApplication.Api.InMem.TokenAuth/Dockerfile"
    environment:
      sensenet__authentication__repositoryUrl: "https://localhost:${REPOSITORY_PORT:-${LEGACY_INMEM_REPOSITORY_PORT:-18176}}"
      sensenet__authentication__authServerType: "IdentityServer"
      sensenet__authentication__authority: "https://localhost:${AUTH_PORT:-${LEGACY_INMEM_AUTH_PORT:-18177}}"
      sensenet__authentication__metadatahost: "http://snis"
      sensenet__authentication__AddJwtCookie: "true"
    ports: ["127.0.0.1:${REPOSITORY_PORT:-${LEGACY_INMEM_REPOSITORY_PORT:-18176}}:443"]
    depends_on:
      snis:
        condition: "service_started"
  snis:
    extends:
      file: "compose.services.yml"
      service: "identity"
    environment:
      IdentityServer__IssuerUri: "https://localhost:${AUTH_PORT:-${LEGACY_INMEM_AUTH_PORT:-18177}}"
      sensenet__Clients__adminui__RepositoryHosts__0__PublicHost: "https://localhost:${REPOSITORY_PORT:-${LEGACY_INMEM_REPOSITORY_PORT:-18176}}"
      sensenet__Clients__spa__RepositoryHosts__0__PublicHost: "https://localhost:${REPOSITORY_PORT:-${LEGACY_INMEM_REPOSITORY_PORT:-18176}}"
      sensenet__Clients__client__RepositoryHosts__0__PublicHost: "https://localhost:${REPOSITORY_PORT:-${LEGACY_INMEM_REPOSITORY_PORT:-18176}}"
    ports: ["127.0.0.1:${AUTH_PORT:-${LEGACY_INMEM_AUTH_PORT:-18177}}:443"]
networks:
  sensenet:
    driver: "bridge"
