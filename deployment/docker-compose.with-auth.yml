# Matching installer scenario (legacy ports are opt-in): ./install-sensenet.ps1 -UseAuth
# Run from this folder: docker compose -f docker-compose.with-auth.yml up -d
name: "sensenet-demo-with-auth"
services:
  prerequisites:
    extends:
      file: "compose.services.yml"
      service: "prerequisites"
  snapp:
    extends:
      file: "compose.services.yml"
      service: "repository"
    image: "sensenetcsp/sn-api-sql:${SN_IMAGE_TAG:-preview}"
    build:
      context: "../src"
      dockerfile: "WebApps/SnWebApplication.Api.Sql.TokenAuth/Dockerfile"
    environment:
      sensenet__authentication__repositoryUrl: "https://localhost:${REPOSITORY_PORT:-${LEGACY_CONTAINER_REPOSITORY_PORT:-18026}}"
      ConnectionStrings__SnCrMsSql: "Persist Security Info=False;Initial Catalog=${COMPOSE_PROJECT_NAME}-sndb;Data Source=snsql;User ID=sa;Password=${SQL_PASSWORD:-SuP3rS3CuR3P4sSw0Rd};TrustServerCertificate=true"
      sensenet__authentication__authServerType: "SNAuth"
      sensenet__authentication__authority: "https://localhost:${AUTH_PORT:-${LEGACY_CONTAINER_AUTH_PORT:-18027}}"
      sensenet__authentication__metadatahost: "http://snis"
      sensenet__authentication__AddJwtCookie: "false"
    ports: ["127.0.0.1:${REPOSITORY_PORT:-${LEGACY_CONTAINER_REPOSITORY_PORT:-18026}}:443"]
    depends_on:
      db-init:
        condition: "service_completed_successfully"
      snis:
        condition: "service_started"
  db-init:
    extends:
      file: "compose.services.yml"
      service: "mssql-init"
    depends_on:
      snsql:
        condition: "service_healthy"
  snsql:
    extends:
      file: "compose.services.yml"
      service: "mssql"
    ports: ["127.0.0.1:${SQL_PORT:-18029}:1433"]
  snis:
    extends:
      file: "compose.services.yml"
      service: "snauth"
    environment:
      Sensenet__Repository__Url: "https://localhost:${REPOSITORY_PORT:-${LEGACY_CONTAINER_REPOSITORY_PORT:-18026}}"
      JwtSettings__Issuer: "https://localhost:${AUTH_PORT:-${LEGACY_CONTAINER_AUTH_PORT:-18027}}"
      Application__Url: "https://localhost:${AUTH_PORT:-${LEGACY_CONTAINER_AUTH_PORT:-18027}}"
      Application__AllowedHosts__1: "https://localhost:${REPOSITORY_PORT:-${LEGACY_CONTAINER_REPOSITORY_PORT:-18026}}"
    ports: ["127.0.0.1:${AUTH_PORT:-${LEGACY_CONTAINER_AUTH_PORT:-18027}}:443"]
networks:
  sensenet:
    driver: "bridge"
