# Equivalent demo: ./install-sensenet.ps1 -UseAuth -WebApp Preview
# Run from this folder: docker compose -f docker-compose.preview.yml up -d
name: "sensenet-insql-cdb"
services:
  snapp:
    extends:
      file: "compose.services.yml"
      service: "repository"
    image: "sensenetcsp/sn-api-sql-prv:${SN_IMAGE_TAG:-preview}"
    build:
      context: "../src"
      dockerfile: "WebApps/SnWebApplication.Api.Sql.TokenAuth.Preview/Dockerfile"
    environment:
      sensenet__authentication__repositoryUrl: "https://localhost:51016"
      ConnectionStrings__SnCrMsSql: "Persist Security Info=False;Initial Catalog=${COMPOSE_PROJECT_NAME}-sndb;Data Source=snsql;User ID=sa;Password=${SQL_PASSWORD:-SuP3rS3CuR3P4sSw0Rd};TrustServerCertificate=true"
      sensenet__authentication__authServerType: "SNAuth"
      sensenet__authentication__authority: "https://localhost:51017"
      sensenet__authentication__metadatahost: "http://snis"
      sensenet__authentication__AddJwtCookie: "false"
    ports: ["127.0.0.1:51016:443"]
    depends_on:
      db-init:
        condition: "service_completed_successfully"
      snis:
        condition: "service_started"
  db-init:
    extends:
      file: "compose.services.yml"
      service: "mssql-init"
    depends_on:
      snsql:
        condition: "service_healthy"
  snsql:
    extends:
      file: "compose.services.yml"
      service: "mssql"
  snis:
    extends:
      file: "compose.services.yml"
      service: "snauth"
    environment:
      Sensenet__Repository__Url: "https://localhost:51016"
      JwtSettings__Issuer: "https://localhost:51017"
      Application__Url: "https://localhost:51017"
      Application__AllowedHosts__1: "https://localhost:51016"
    ports: ["127.0.0.1:51017:443"]
networks:
  sensenet:
    driver: "bridge"
